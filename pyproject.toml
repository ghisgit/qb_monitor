[project]
name = "qb-monitor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pyyaml>=6.0.3", "qbittorrent-api>=2026.7.0"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.11.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "N", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
