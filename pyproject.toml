[project]
name = "qb-monitor"
version = "0.1.0"
description = "自动监控 qBittorrent 的标签驱动工具：按分类打标签、清理无用文件、卡顿降级，并用 DeepSeek Harness 识别媒体并匹配 TMDB，按 Jellyfin 结构硬链接整理入库。"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepseek-harness-sdk>=0.1.1rc1 ; sys_platform != 'win32'",
    "pyyaml>=6.0.3",
    "qbittorrent-api>=2026.7.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.11.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "N", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
