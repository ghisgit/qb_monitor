# 种子匹配规则（正则表达式，匹配不区分大小写）
# 说明：规则列表为空（[]）时不启用任何规则
rules:
  added: # 新增种子时触发的规则，匹配文件名将跳过下载
    - "(\\.nfo|\\.txt|\\.jpg|\\.png|\\.url)$" # 示例：跳过说明/封面/字幕网址类文件
    - "sample" # 示例：跳过影片截图(sample)
  completed: # 种子完成时触发的规则，匹配文件名/目录名将删除
    - "(\\.nfo|\\.txt|\\.jpg|\\.png|\\.url)$" # 示例：删除说明/封面/字幕网址类文件
    - "sample" # 示例：删除影片截图(sample)

# 分类标签映射（可选）：按动作（added/completed）区分，动作完成后按 qB 分类（Category）补打标签
# qB 中每个种子最多只有一个分类；检测：分类与键名正则匹配（re.search，不区分大小写，可命中
# 子分类如 movies/4K）；多个键命中时标签合并去重；值支持字符串或列表；省略或为空则不启用
category_tags:
  added: # 新增种子处理完成后应用
    "^movies": "电影" # 示例：分类 movies、movies/4K 均命中
    "^anime": ["动漫", "追番"] # 示例：一次打两个标签
  completed: # 完成清理完成后应用
    "^tv": "organize" # 示例：tv 类完成后打入 organize 标签（触发下面组织处理器）

# organize 组织处理器（可选）：打上触发标签的种子完成后，由 DeepSeek Harness agent
# 识别发布名并匹配 TMDB 元数据，再按 Jellyfin 官方推荐目录结构硬链接到媒体库（失败回退拷贝）
# 依赖 deepseek-harness-sdk（无 Windows 平台运行时；Windows 下请保持 enabled: false 或使用 Docker）
# 省略本节或 enabled: false 即停用
organize:
  enabled: true
  tags: ["organize"] # 触发标签（可多个；轮询自动识别，零轮询改动）
  library:
    movies_dir: "/media/movies" # 电影根目录
    tv_dir: "/media/tv" # 剧集根目录
    fallback_dir: "/media/unmatched" # AI 识别失败/未匹配时的镜像兜底目录（保持种子原始结构）
  tmdb_api_key: "your-tmdb-v3-api-key" # TMDB API Key（经环境变量注入 agent，不进入提示词）
  on_exists: "skip" # 目标文件已存在：skip=跳过 / overwrite=删除后重建
  on_match_failure: "fallback" # AI 匹配失败：fallback=镜像进 fallback_dir / fail=保留触发标签报错重试
  ai_retries: 1 # 单个种子 AI 瞬时失败的进程内重试次数
  min_file_size_mb: 0 # 小于该大小的视频文件跳过（防止样本/缩略图入库）
  include_episode_title: false # true=文件名附加 TMDB 单集标题
  include_tmdb_id: true # true=目录/文件名附加 [tmdbid-xxxx]（Jellyfin provider-id 后缀）
  video_extensions:
    - ".mp4"
    - ".mkv"
    - ".avi"
    - ".ts"
    - ".m2ts"
    - ".wmv"
    - ".iso"
  dsh: # DeepSeek Harness runtime 参数
    model: "deepseek-v4-flash" # 模型 ID
    api_key: "" # 留空则使用环境变量 DEEPSEEK_API_KEY
    base_url: "" # 留空则使用环境变量 DEEPSEEK_BASE_URL
    language: "zh-CN" # TMDB 搜索语言与标题本地化语言
    request_timeout_seconds: 300 # 单个种子 AI 轮次超时（秒）
    session_root: "sessions" # agent 会话 JSONL 存储目录（.gitignore 已排除）
    max_concurrent_sessions: 1 # 同一 runtime 内并发 AI 会话数；占满时种子让位、下轮重试（建议 ≤ max_worker_threads）

# qBittorrent WebUI 连接配置
qbittorrent:
  host: "http://127.0.0.1:8080" # WebUI 地址
  username: "admin" # WebUI 用户名
  password: "adminadmin" # WebUI 密码

# 客户端高级配置（可选，省略时使用代码内置默认值）
client:
  connect_timeout: 5 # 连接超时（秒）
  read_timeout: 30 # 读取超时（秒）
  retry: # API 调用重试策略
    max_attempts: 3 # 最大重试次数
    delay: 1.0 # 初始重试延迟（秒）
    backoff: 1.0 # 延迟倍增因子
    cap: 30.0 # 最大延迟上限（秒）
  circuit_breaker: # 熔断器配置
    failure_threshold: 5 # 连续失败次数阈值，超过后熔断
    recovery_timeout: 30.0 # 熔断后恢复等待时间（秒）

# 处理器运行参数
processor:
  poll_interval_seconds: 30 # 轮询间隔（秒），检查种子状态的频率
  stall_timeout_hours: 1 # 停滞超时（小时），超过此时间的下载种子将被降级
  max_worker_threads: 3 # 最大工作线程数，并发处理种子的数量

# 日志系统配置（environment 默认 production；json_format 生产环境默认 true；
# sensitive_masking 生产环境默认开启）
logging:
  logfile: "logs/qb_auto.log" # 日志文件路径
  level: "INFO" # 日志级别: DEBUG / INFO / WARNING / ERROR / FATAL（DEBUG 用于调试）
  environment: "development" # 运行环境: development / testing / production
  json_format: false # true=JSON结构化输出, false=可读文本格式
  rotation: # 日志轮转策略
    max_file_size_mb: 10 # 单个日志文件最大大小（MB）
    backup_count: 30 # 保留的备份文件数量
    retention_days: 30 # 日志文件保留天数，超期自动清理
    when: "midnight" # 按时间轮转: midnight=每日, H=每小时, D=每天
  sensitive_masking: false # true=自动脱敏password/token/secret等敏感信息
