# 种子匹配规则（正则表达式，匹配不区分大小写）
# 说明：规则列表为空（[]）时不启用任何规则
rules:
  added: # 新增种子时触发的规则，匹配文件名将跳过下载
    - "(\\.nfo|\\.txt|\\.jpg|\\.png|\\.url)$" # 示例：跳过说明/封面/字幕网址类文件
    - "sample" # 示例：跳过影片截图(sample)
  completed: # 种子完成时触发的规则，匹配文件名/目录名将删除
    - "(\\.nfo|\\.txt|\\.jpg|\\.png|\\.url)$" # 示例：删除说明/封面/字幕网址类文件
    - "sample" # 示例：删除影片截图(sample)

# 分类标签映射（可选）：按动作（added/completed）区分，动作完成后按 qB 分类（Category）补打标签
# qB 中每个种子最多只有一个分类；检测：分类与键名正则匹配（re.search，不区分大小写，可命中
# 子分类如 movies/4K）；多个键命中时标签合并去重；值支持字符串或列表；省略或为空则不启用
category_tags:
  added: # 新增种子处理完成后应用
    "^movies": "电影" # 示例：分类 movies、movies/4K 均命中
    "^anime": ["动漫", "追番"] # 示例：一次打两个标签
  completed: # 完成清理完成后应用
    "^tv": "剧集" # 示例：分类 tv、tv/纪录片 等命中

# qBittorrent WebUI 连接配置
qbittorrent:
  host: "http://127.0.0.1:8080" # WebUI 地址
  username: "admin" # WebUI 用户名
  password: "adminadmin" # WebUI 密码

# 客户端高级配置（可选，省略时使用代码内置默认值）
client:
  connect_timeout: 5 # 连接超时（秒）
  read_timeout: 30 # 读取超时（秒）
  retry: # API 调用重试策略
    max_attempts: 3 # 最大重试次数
    delay: 1.0 # 初始重试延迟（秒）
    backoff: 1.0 # 延迟倍增因子
    cap: 30.0 # 最大延迟上限（秒）
  circuit_breaker: # 熔断器配置
    failure_threshold: 5 # 连续失败次数阈值，超过后熔断
    recovery_timeout: 30.0 # 熔断后恢复等待时间（秒）

# 处理器运行参数
processor:
  poll_interval_seconds: 30 # 轮询间隔（秒），检查种子状态的频率
  stall_timeout_hours: 1 # 停滞超时（小时），超过此时间的下载种子将被降级
  max_worker_threads: 3 # 最大工作线程数，并发处理种子的数量

# 日志系统配置（environment 默认 production；json_format 生产环境默认 true；
# sensitive_masking 生产环境默认开启）
logging:
  logfile: "logs/qb_auto.log" # 日志文件路径
  level: "INFO" # 日志级别: DEBUG / INFO / WARNING / ERROR / FATAL（DEBUG 用于调试）
  environment: "development" # 运行环境: development / testing / production
  json_format: false # true=JSON结构化输出, false=可读文本格式
  rotation: # 日志轮转策略
    max_file_size_mb: 10 # 单个日志文件最大大小（MB）
    backup_count: 30 # 保留的备份文件数量
    retention_days: 30 # 日志文件保留天数，超期自动清理
    when: "midnight" # 按时间轮转: midnight=每日, H=每小时, D=每天
  sensitive_masking: false # true=自动脱敏password/token/secret等敏感信息
